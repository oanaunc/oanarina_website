name: Deploy to hosting (FTP)

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-ftp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Archi Tool Windows installer (~130 MB) is too big for git (GitHub's 100 MB file limit). Each .exe listed in
      # downloads/archi-tool/SHA256SUMS.txt is fetched from its GitHub release (windows-v<version> in the public
      # oanaunc/archi_tool repository, published by that repository's "Windows app" workflow after its tests passed),
      # checked against the committed SHA-256 and then uploaded with the rest of the site.
      - name: Archi Tool Windows installer from its GitHub release
        shell: bash
        run: |
          set -euo pipefail
          sums=downloads/archi-tool/SHA256SUMS.txt
          [ -f "$sums" ] || exit 0
          grep -E '^[0-9a-f]{64}  Oanarina-Archi-Tool-Setup-[0-9.]+\.exe$' "$sums" | while read -r sha name; do
            ver="${name#Oanarina-Archi-Tool-Setup-}"; ver="${ver%.exe}"
            url="https://github.com/oanaunc/archi_tool/releases/download/windows-v$ver/$name"
            echo "fetching $url"
            curl -fsSL --retry 3 -o "downloads/archi-tool/$name" "$url"
            echo "$sha  downloads/archi-tool/$name" | sha256sum -c -
            ls -la "downloads/archi-tool/$name"
          done

      # Strip BOM/CR/LF from secrets (common when pasting). Resolve hostname to IPv4 for the
      # FTP client: many hosts mis-report PASV; using the literal IP avoids getaddrinfo ENOTFOUND
      # on the control/data path (see SamKirkland/FTP-Deploy-Action issues #293, #400).
      - name: Prepare FTP server address
        shell: bash
        env:
          RAW_FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import ipaddress
          import os
          import socket
          import sys

          raw = os.environ.get("RAW_FTP_HOST", "")
          h = raw.replace("\ufeff", "").replace("\r", "").replace("\n", "").strip()
          if not h:
              print("::error::FTP_HOST is empty after cleanup.", file=sys.stderr)
              sys.exit(1)
          if "://" in h or "/" in h:
              print(
                  "::error::FTP_HOST must be a bare hostname or IPv4 (no ftp://, no /public_html).",
                  file=sys.stderr,
              )
              sys.exit(1)

          def is_ipv4(s: str) -> bool:
              try:
                  ipaddress.IPv4Address(s)
                  return True
              except ValueError:
                  return False

          if is_ipv4(h):
              server = h
          else:
              try:
                  infos = socket.getaddrinfo(h, 21, family=socket.AF_INET, type=socket.SOCK_STREAM)
              except OSError as e:
                  print(
                      "::error::Could not resolve FTP_HOST as IPv4 from GitHub. "
                      "Check the secret spelling, or set FTP_HOST to the IPv4 from cPanel. "
                      f"Details: {e}",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              server = infos[0][4][0]

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"FTP_SERVER={server}\n")
          print("Using FTP server address:", server)
          PY

      # Incremental sync: keeps public_html/.ftp-deploy-sync-state.json and only uploads files
      # whose content changed since the last successful deploy (not a full reupload each push).
      # This is hash-based vs that state file, not a literal "git diff of one commit".
      - name: Upload site via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.sass-cache/**
            **/scss/**
